# Edge Function settings for CarCare. Merge into the config.toml that
# `supabase init` generates if you create one.

[functions.razorpay-create-order]
verify_jwt = true

[functions.razorpay-verify]
verify_jwt = true

# Razorpay calls this without a user JWT; the HMAC signature authenticates it.
[functions.razorpay-webhook]
verify_jwt = false
